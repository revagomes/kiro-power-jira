[project]
name = "jira-mcp"
version = "0.4.1"
description = "JIRA MCP server — generic, project-agnostic ticket management over MCP."
requires-python = ">=3.11"
dependencies = [
    "fastmcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["server/tests"]
addopts = "-q"

[tool.coverage.run]
source = ["server"]
omit = ["server/tests/*"]

[tool.coverage.report]
show_missing = true
